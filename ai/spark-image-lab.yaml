apiVersion: v1
kind: Service
metadata:
  name: sparkimagelab
  namespace: homelab
spec:
  type: ExternalName
  externalName: 192.168.1.165
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sparkimagelab-ratelimit
  namespace: homelab
spec:
  rateLimit:
    average: 30
    period: 1s
    burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sparkimagelab-auth
  namespace: homelab
spec:
  basicAuth:
    secret: sparkimagelab-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sparkimagelab
  namespace: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: acmecertresolver
    traefik.ingress.kubernetes.io/router.middlewares: homelab-sparkimagelab-ratelimit@kubernetescrd,homelab-sparkimagelab-auth@kubernetescrd
spec:
  rules:
    - host: sparkimagelab.martijnj.nl
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: sparkimagelab
                port:
                  number: 80
